<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Projets — Louis Reynaerts Architecture. Nouvelles constructions, rénovations et régularisations en Belgique.">
<title>Projets | Louis Reynaerts Architecture</title>
<link rel="icon" type="image/svg+xml" href="images/favicon-lr.svg">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #0a0a0a;
    --white: #ffffff;
    --gray: #c8c5be;
    --light: #f0ede8;
    --serif: 'EB Garamond', Georgia, serif;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  @font-face { font-family: 'EB Garamond'; font-style: normal; font-weight: 100 900; src: url('fonts/EBGaramond-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 100 900; src: url('fonts/EBGaramond-Italic.ttf') format('truetype'); }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--white);
    color: var(--black);
    font-family: var(--sans);
    font-weight: 300;
    display: flex;
    flex-direction: column;
  }

  /* NAV minimal — juste le logo */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    pointer-events: none;
  }

  .top-bar a { pointer-events: all; }

  .nav-logo {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--black);
    text-decoration: none;
    mix-blend-mode: multiply;
  }

  .nav-back {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray);
    text-decoration: none;
    transition: color 0.3s;
  }

  .nav-back:hover { color: var(--black); }

  /* DEUX BANDES */
  .menu-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .menu-item {
    flex: 1;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: flex;
    align-items: flex-end;
    padding: 3rem 4rem;
    transition: background 0.4s;
    min-height: 50vh;
  }

  .menu-item:first-child {
    background: var(--white);
    border-bottom: 1px solid #e8e5e0;
  }

  .menu-item:last-child {
    background: var(--light);
  }

  .menu-item:hover:first-child { background: #f5f5f3; }
  .menu-item:hover:last-child { background: #e8e4de; }

  .menu-item-content { position: relative; z-index: 1; }

  .menu-item-number {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gray);
    display: block;
    margin-bottom: 1.2rem;
  }

  .menu-item-title {
    font-family: var(--serif);
    font-size: clamp(2rem, 4vw, 4rem);
    font-weight: 400;
    color: var(--black);
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .menu-item-count {
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    transition: gap 0.3s;
  }

  .menu-item:hover .menu-item-count { gap: 1rem; }
  .menu-item-count::after { content: '→'; font-size: 0.8rem; }

  /* MOBILE */
  @media (max-width: 768px) {
    .top-bar { padding: 1.2rem 1.5rem; }
    .nav-logo { font-size: 1rem; }
    .menu-item { padding: 2.5rem 1.5rem; min-height: 45vh; }
    .menu-item-title { font-size: clamp(1.8rem, 6vw, 2.5rem); }
  }

  @media (max-width: 480px) {
    .nav-logo { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="nav-logo">Louis Reynaerts Architecture</a>
  <a href="index.html" class="nav-back">← Accueil</a>
</div>

<div class="menu-wrap">

  <a href="projets-constructions.html" class="menu-item">
    <div class="menu-item-content">
      <span class="menu-item-number">01</span>
      <h2 class="menu-item-title">Nouvelles<br>constructions</h2>
      <span class="menu-item-count">2 projets</span>
    </div>
  </a>

  <a href="projets-renovations.html" class="menu-item">
    <div class="menu-item-content">
      <span class="menu-item-number">02</span>
      <h2 class="menu-item-title">Rénovations, extensions<br>&amp; régularisations</h2>
      <span class="menu-item-count">2 projets</span>
    </div>
  </a>

</div>

</body>
</html>
